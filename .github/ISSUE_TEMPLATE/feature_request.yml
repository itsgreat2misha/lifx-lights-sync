name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like LIFX Lights Sync to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What setup or use case does this enable?
    validations:
      required: false
