name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Music Assistant version, how the plugin is installed, discovery source setting, and the LIFX products involved.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Music Assistant log lines for lifx_lights_sync. Remove any tokens or credentials before posting.
      render: shell
    validations:
      required: false
